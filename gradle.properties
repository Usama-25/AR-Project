# Project-wide Gradle settings.
# Increase JVM heap space to 3GB so D8/R8 and Filament native dexing does not run out of memory
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.java.home=C:\\Program Files\\Android\\openjdk\\jdk-21.0.8

# AndroidX support
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
